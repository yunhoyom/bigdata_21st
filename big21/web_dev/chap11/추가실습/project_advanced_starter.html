  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f0f2f5;
      color: #2c3e50;
    }
    h1 { text-align: center; font-size: 1.6rem; margin-bottom: 24px; }

    .app-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    /* 입력 영역 */
    #input-area { display: flex; gap: 8px; margin-bottom: 16px; }
    #todo-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
    }
    #todo-input:focus { border-color: #3498db; outline: none; }
    #add-btn {
      padding: 10px 18px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    #add-btn:hover { background: #2980b9; }

    /* 필터 탭 */
    #filter-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      list-style: none;
      padding: 0;
    }
    .filter-tab {
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      background: #f0f0f0;
      border: none;
      transition: background 0.15s;
    }
    .filter-tab.active {
      background: #3498db;
      color: white;
    }

    /* 할 일 목록 */
    #todo-list { list-style: none; padding: 0; margin: 0; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fafafa;
    }
    .todo-item.done .todo-text { text-decoration: line-through; color: #aaa; }
    .todo-text { flex: 1; font-size: 1rem; }
    .complete-btn, .delete-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
      color: white;
    }
    .complete-btn { background: #2ecc71; }
    .delete-btn   { background: #e74c3c; }
    .complete-btn:hover { background: #27ae60; }
    .delete-btn:hover   { background: #c0392b; }

    /* 하단 영역 */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }
    #counter { font-size: 0.85rem; color: #95a5a6; }
    #clear-all-btn {
      padding: 6px 12px;
      background: #95a5a6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    #clear-all-btn:hover { background: #7f8c8d; }
    #empty-msg {
      text-align: center;
      color: #bdc3c7;
      padding: 24px;
      font-size: 0.95rem;
    }
  </style>
</head>
